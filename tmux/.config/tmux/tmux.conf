unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf

set-window-option -g mode-keys vi
set -g mouse on
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'Escape' send-keys -X clear-selection

set -g base-index 1
set -g renumber-windows on
set-option -g history-limit 100000

run-shell 'source ~/dotfiles/palette.sh \
    && tmux set -g status-style                "bg=$PAL_BG fg=$PAL_COMMENT" \
    && tmux set -g status-left-style           "bg=$PAL_BG fg=$PAL_GOLD bold" \
    && tmux set -g window-status-current-style "bg=$PAL_BG fg=$PAL_MAGENTA bold" \
    && tmux set -g window-status-style         "bg=$PAL_BG fg=$PAL_COMMENT" \
    && tmux set -g pane-border-style           "fg=$PAL_SELECTION" \
    && tmux set -g pane-active-border-style    "fg=$PAL_MAGENTA" \
    && tmux set -g message-style               "bg=$PAL_BG_ALT fg=$PAL_FG" \
    && tmux set -g window-style                "bg=$PAL_BG fg=$PAL_FG" \
    && tmux set -g window-active-style         "bg=$PAL_BG fg=$PAL_FG"'

set-option -g status-right "#[align=absolute-centre]#[align=right]%H:%M %a-%d-%b"
set-window-option -g status-left "#(echo '#{session_name}' | sed 's/^aut-//')"

set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-kitty:RGB'
set-option -sg escape-time 10
set-option -g focus-events on
set -g allow-passthrough on

bind-key t display-popup -x C -y C -w 50 -h 3 'echo "$(tmux display-message -p "#{session_name}" | sed "s/^aut-//") $(date "+%H:%M %a-%d-%b")"; read -p "Press enter..."'
bind-key -r C-t display-popup -E -w 100% -h 98% -d "#{pane_current_path}" "~/tmux-sessionizer"
bind-key -r C-l display-popup -E -w 100% -h 100% -d "#{pane_current_path}" "~/tmux-claude-sessions"
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/TODO.md"

set -g mouse on
