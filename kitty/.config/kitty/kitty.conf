font_family       JetBrainsMono Nerd Font Mono
disable_ligatures always
font_size         24

cursor_shape        block
cursor_blink_interval 0
cursor_trail        3

window_padding_width    14
background_opacity      0.94
dynamic_background_opacity yes
hide_window_decorations yes
map cmd+down set_background_opacity +0.1
map cmd+up   set_background_opacity -0.1

enable_audio_bell       no
touch_scroll_multiplier 2.0

tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_edge            top
active_tab_font_style   bold
inactive_tab_font_style normal

allow_remote_control yes
listen_on unix:/tmp/kitty-theme

mouse_map cmd+left press grabbed discard_event
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link

include palette.conf
